name: api

# Regenerate api/ by hand (publish.yml does it after every `brew pr-pull`).
on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Generate
        run: |
          cd "$(brew --repo "$GITHUB_REPOSITORY")"
          bin/generate-api
          git add api
          git diff --cached --quiet || git commit -m "api: update"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          branch: main
